<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gantt - Oficina</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: #0d0d0d;
    color: #e8e8e8;
    height: 100vh;
    overflow: hidden;
  }

  /* Fundo com imagem + opacidade */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url('fundo.png');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    opacity: 0.08;
    z-index: 0;
    pointer-events: none;
  }

  .app {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 16px 20px;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid #2a2a2a;
    margin-bottom: 12px;
    flex-shrink: 0;
  }
  header img.logo {
    height: 42px;
    object-fit: contain;
  }
  header h1 {
    font-size: 20px;
    font-weight: 600;
    color: #d4af37;
    letter-spacing: 0.5px;
  }
  header .spacer { flex: 1; }
  header .btn {
    padding: 8px 16px;
    background: #d4af37;
    color: #0d0d0d;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
    transition: 0.2s;
  }
  header .btn:hover { background: #e8c860; }
  header .btn.secondary {
    background: transparent;
    border: 1px solid #d4af37;
    color: #d4af37;
  }
  header .btn.secondary:hover { background: rgba(212,175,55,0.1); }

  /* Área do Gantt: duas tabelas lado a lado */
  .gantt-container {
    flex: 1;
    display: flex;
    overflow: hidden;
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    background: rgba(15,15,15,0.6);
    backdrop-filter: blur(4px);
  }

  /* Painel fixo (dados) */
  .fixed-panel {
    width: 620px;
    min-width: 620px;
    display: flex;
    flex-direction: column;
    border-right: 2px solid #d4af37;
  }
  .fixed-scroll {
    overflow-y: auto;
    flex: 1;
  }
  .fixed-scroll::-webkit-scrollbar { width: 0; } /* esconde scroll - sincronizado via JS */

  /* Painel rolável (gráfico) */
  .scroll-panel {
    flex: 1;
    overflow: auto;
  }
  .scroll-panel::-webkit-scrollbar { height: 10px; width: 10px; }
  .scroll-panel::-webkit-scrollbar-thumb { background: #333; border-radius: 5px; }
  .scroll-panel::-webkit-scrollbar-thumb:hover { background: #444; }

  /* Tabelas */
  table {
    border-collapse: collapse;
    width: 100%;
    table-layout: fixed;
  }
  thead th {
    position: sticky;
    top: 0;
    background: #1a1a1a;
    color: #d4af37;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 10px 8px;
    border-bottom: 1px solid #2a2a2a;
    z-index: 5;
    text-align: left;
  }
  tbody td {
    padding: 8px;
    border-bottom: 1px solid #222;
    font-size: 12px;
    vertical-align: middle;
  }
  tbody tr:hover td { background: rgba(212,175,55,0.04); }

  /* Colunas fixas */
  .col-nome   { width: 200px; }
  .col-resp   { width: 90px; }
  .col-ini    { width: 85px; }
  .col-fim    { width: 85px; }
  .col-prog   { width: 60px; text-align: center; }
  .col-acoes  { width: 100px; text-align: center; }

  .nome-cell {
    font-weight: 500;
    color: #f0f0f0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .nome-cell.sub {
    padding-left: 24px;
    color: #b8b8b8;
    font-size: 11.5px;
  }
  .nome-cell .toggle {
    display: inline-block;
    width: 14px;
    cursor: pointer;
    color: #d4af37;
    user-select: none;
    font-size: 10px;
  }
  .data-cell { font-family: 'Consolas', monospace; font-size: 11px; color: #aaa; }

  .progress-mini {
    font-family: 'Consolas', monospace;
    font-size: 11px;
    font-weight: 600;
    color: #d4af37;
  }

  /* Botões de ação */
  .actions { display: flex; gap: 4px; justify-content: center; }
  .icon-btn {
    background: transparent;
    border: 1px solid #333;
    color: #aaa;
    border-radius: 4px;
    width: 24px;
    height: 24px;
    cursor: pointer;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.15s;
    padding: 0;
  }
  .icon-btn:hover { color: #d4af37; border-color: #d4af37; }
  .icon-btn.del:hover { color: #ff5c5c; border-color: #ff5c5c; }
  .icon-btn.pause.active { color: #ff9900; border-color: #ff9900; background: rgba(255,153,0,0.1); }

  /* Gráfico */
  .chart-wrapper {
    position: relative;
    min-width: 100%;
  }
  .chart-header {
    display: flex;
    position: sticky;
    top: 0;
    z-index: 5;
    background: #1a1a1a;
    border-bottom: 1px solid #2a2a2a;
  }
  .chart-header .month-cell {
    flex-shrink: 0;
    padding: 10px 8px;
    font-size: 11px;
    font-weight: 700;
    color: #d4af37;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-right: 1px solid #2a2a2a;
    text-align: center;
  }
  .chart-body { position: relative; }

  .chart-row {
    display: flex;
    height: 40px;
    border-bottom: 1px solid #222;
    position: relative;
  }
  .chart-row:hover { background: rgba(212,175,55,0.04); }

  .grid-cell {
    flex-shrink: 0;
    border-right: 1px solid #222;
    height: 100%;
    position: relative;
  }
  .grid-cell.week { border-right: 1px dashed #2a2a2a; }

  /* Barra */
  .bar {
    position: absolute;
    top: 8px;
    height: 24px;
    border-radius: 4px;
    background: linear-gradient(180deg, #d4af37 0%, #b8932a 100%);
    box-shadow: 0 2px 6px rgba(212,175,55,0.3);
    display: flex;
    align-items: center;
    overflow: hidden;
    cursor: default;
    min-width: 2px;
  }
  .bar .fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    background: rgba(0,0,0,0.35);
    border-right: 2px solid rgba(255,255,255,0.4);
    transition: width 0.3s;
  }
  .bar .label {
    position: relative;
    z-index: 2;
    padding: 0 6px;
    font-size: 10px;
    font-weight: 700;
    color: #1a1a1a;
    white-space: nowrap;
    text-shadow: 0 1px 0 rgba(255,255,255,0.2);
  }
  .bar.paused {
    background: transparent;
    border: 2px dashed #ff9900;
    box-shadow: none;
  }
  .bar.paused .fill { display: none; }
  .bar.paused .label { color: #ff9900; }
  .bar.sub-bar {
    top: 12px;
    height: 16px;
    background: linear-gradient(180deg, #8a8a8a 0%, #6a6a6a 100%);
    box-shadow: none;
  }
  .bar.sub-bar .label { font-size: 9px; color: #fff; }

  /* Linha "hoje" */
  .today-line {
    position: absolute;
    top: 0; bottom: 0;
    width: 2px;
    background: #ff4d4d;
    z-index: 4;
    pointer-events: none;
    box-shadow: 0 0 8px rgba(255,77,77,0.6);
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 24px;
    width: 380px;
    max-width: 92vw;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8);
  }
  .modal h2 {
    color: #d4af37;
    font-size: 16px;
    margin-bottom: 16px;
  }
  .modal label {
    display: block;
    font-size: 11px;
    color: #999;
    margin: 10px 0 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .modal input, .modal select {
    width: 100%;
    padding: 9px 10px;
    background: #0d0d0d;
    border: 1px solid #333;
    border-radius: 6px;
    color: #eee;
    font-size: 13px;
    font-family: inherit;
  }
  .modal input:focus, .modal select:focus {
    outline: none;
    border-color: #d4af37;
  }
  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    justify-content: flex-end;
  }
  .modal-actions button {
    padding: 9px 18px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    font-size: 13px;
  }
  .modal-actions .cancel { background: #2a2a2a; color: #ccc; }
  .modal-actions .save { background: #d4af37; color: #0d0d0d; }
  .modal-actions .save:hover { background: #e8c860; }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 40px;
    color: #555;
    font-size: 13px;
  }

  /* Loading */
  .loading {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    color: #d4af37;
    font-size: 14px;
    letter-spacing: 1px;
  }
  .loading.hidden { display: none; }
</style>
</head>
<body>

<div class="loading" id="loading">Carregando dados...</div>

<div class="app">
  <header>
    <img src="logo-gold.png" alt="Logo" class="logo" onerror="this.style.display='none'">
    <h1>Gantt — Oficina</h1>
    <div class="spacer"></div>
    <button class="btn secondary" id="btnRefresh">↻ Atualizar</button>
    <button class="btn" id="btnAdd">+ Nova Tarefa</button>
  </header>

  <div class="gantt-container">
    <!-- Painel fixo -->
    <div class="fixed-panel">
      <table>
        <thead>
          <tr>
            <th class="col-nome">Tarefa</th>
            <th class="col-resp">Resp.</th>
            <th class="col-ini">Início</th>
            <th class="col-fim">Fim</th>
            <th class="col-prog">%</th>
            <th class="col-acoes">Ações</th>
          </tr>
        </thead>
      </table>
      <div class="fixed-scroll" id="fixedScroll">
        <table>
          <tbody id="fixedBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Painel rolável (gráfico) -->
    <div class="scroll-panel" id="scrollPanel">
      <div class="chart-wrapper" id="chartWrapper">
        <div class="chart-header" id="chartHeader"></div>
        <div class="chart-body" id="chartBody"></div>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Nova Tarefa</h2>
    <form id="taskForm">
      <input type="hidden" id="taskId">
      <input type="hidden" id="taskParent">

      <label for="inputNome">Nome da tarefa</label>
      <input type="text" id="inputNome" required placeholder="Ex: Troca de óleo">

      <label for="inputResp">Responsável</label>
      <input type="text" id="inputResp" placeholder="Ex: João">

      <label for="inputInicio">Data de início</label>
      <input type="date" id="inputInicio" required>

      <label for="inputFim">Data de fim</label>
      <input type="date" id="inputFim" required>

      <div class="modal-actions">
        <button type="button" class="cancel" id="btnCancel">Cancelar</button>
        <button type="submit" class="save">Salvar</button>
      </div>
    </form>
  </div>
</div>

<script>
/* ============================================================
   CONFIGURAÇÃO SUPABASE
   ============================================================ */
const SUPABASE_URL = 'https://wqtzhhiocmdxiipcsbdb.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndxdHpoaGlvY21keGlpcGNzYmRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMDk3MDUsImV4cCI6MjEwODc4NTcwNX0.s2g9KplJwoxDqlB4eSCIIPN8TK09IEzb1-dgHL9_pXI';
const TABLE = 'tarefas';           // ajuste se sua tabela tiver outro nome

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

/* ============================================================
   ESTADO
   ============================================================ */
let tarefas = [];
let collapsed = {};       // id -> bool (subtarefas recolhidas)
let currentMonthWidth = 100; // px por mês
let minDate = null, maxDate = null;

/* ============================================================
   UTILITÁRIOS DE DATA
   ============================================================ */
function parseDate(s) { return new Date(s + 'T00:00:00'); }
function today() { const d = new Date(); d.setHours(0,0,0,0); return d; }
function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function fmtDate(d) {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0');
  return `${dd}/${m}/${y}`;
}
function fmtInput(d) {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}
function fmtMonth(d) {
  const meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return `${meses[d.getMonth()]}/${String(d.getFullYear()).slice(2)}`;
}

/* ============================================================
   CÁLCULO DE PROGRESSO AUTOMÁTICO
   ============================================================ */
function calcProgress(t) {
  if (t.pausada) return t.progresso ?? 0;
  const inicio = parseDate(t.data_inicio);
  const fim = parseDate(t.data_fim);
  const hoje = today();
  if (hoje <= inicio) return 0;
  if (hoje >= fim) return 100;
  const total = daysBetween(inicio, fim) || 1;
  const decorrido = daysBetween(inicio, hoje);
  return Math.max(0, Math.min(100, Math.round((decorrido / total) * 100)));
}

/* ============================================================
   CARREGAR DADOS
   ============================================================ */
async function carregar() {
  document.getElementById('loading').classList.remove('hidden');
  try {
    const { data, error } = await db.from(TABLE).select('*').order('ordem', { ascending: true });
    if (error) throw error;
    tarefas = (data || []).map(t => ({
      ...t,
      progresso: t.pausada ? (t.progresso ?? 0) : calcProgress(t)
    }));
    // se não houver coluna 'pausada' no banco, tratamos como false
    tarefas = tarefas.map(t => ({ ...t, pausada: !!t.pausada }));
    render();
  } catch (e) {
    console.error(e);
    alert('Erro ao carregar tarefas: ' + e.message + '\n\nVerifique se a tabela "' + TABLE + '" existe no Supabase com as colunas: id, parent_id, nome, responsavel, data_inicio, data_fim, pausada, progresso, ordem');
  } finally {
    document.getElementById('loading').classList.add('hidden');
  }
}

/* ============================================================
   HIERARQUIA
   ============================================================ */
function getRoots() { return tarefas.filter(t => !t.parent_id); }
function getChildren(id) { return tarefas.filter(t => t.parent_id === id); }

// Lista achatada respeitando collapse
function getFlatList() {
  const out = [];
  function walk(parentId, level) {
    const items = tarefas.filter(t => (t.parent_id || null) === parentId);
    items.forEach(t => {
      out.push({ ...t, _level: level });
      if (!collapsed[t.id]) walk(t.id, level + 1);
    });
  }
  walk(null, 0);
  return out;
}

/* ============================================================
   RENDER PRINCIPAL
   ============================================================ */
function render() {
  const flat = getFlatList();
  calcularEscala(flat);
  renderFixed(flat);
  renderChart(flat);
  syncScroll();
}

/* Escala horizontal: do menor início ao maior fim */
function calcularEscala(flat) {
  if (flat.length === 0) { minDate = today(); maxDate = addDays(today(), 30); return; }
  let mn = null, mx = null;
  flat.forEach(t => {
    const i = parseDate(t.data_inicio), f = parseDate(t.data_fim);
    if (!mn || i < mn) mn = i;
    if (!mx || f > mx) mx = f;
  });
  // margem: início do mês anterior e fim do próximo mês
  minDate = new Date(mn.getFullYear(), mn.getMonth(), 1);
  maxDate = new Date(mx.getFullYear(), mx.getMonth() + 2, 0);
  // largura por dia
  const totalDias = daysBetween(minDate, maxDate);
  // largura do mês ~ 100px => ~3.3px/dia
  currentMonthWidth = 100;
  // se período curto, alargar
  if (totalDias < 60) currentMonthWidth = 120;
}

function pxPerDay() {
  // média de dias por mês ~30.44
  return currentMonthWidth / 30.44;
}
function dateToX(d) {
  return daysBetween(minDate, d) * pxPerDay();
}

/* ============================================================
   RENDER PAINEL FIXO
   ============================================================ */
function renderFixed(flat) {
  const tb = document.getElementById('fixedBody');
  if (flat.length === 0) {
    tb.innerHTML = '<tr><td colspan="6" class="empty">Nenhuma tarefa cadastrada. Clique em "+ Nova Tarefa".</td></tr>';
    return;
  }
  tb.innerHTML = flat.map(t => {
    const filhos = getChildren(t.id);
    const isSub = !!t.parent_id;
    const prog = t.pausada ? (t.progresso ?? 0) : calcProgress(t);
    const toggle = filhos.length > 0
      ? `<span class="toggle" data-toggle="${t.id}">${collapsed[t.id] ? '▶' : '▼'}</span>`
      : '<span class="toggle" style="visibility:hidden">•</span>';
    return `
      <tr data-id="${t.id}">
        <td class="col-nome nome-cell ${isSub?'sub':''}">${toggle}${escapeHtml(t.nome)}</td>
        <td class="col-resp data-cell">${escapeHtml(t.responsavel||'—')}</td>
        <td class="col-ini data-cell">${fmtDate(parseDate(t.data_inicio))}</td>
        <td class="col-fim data-cell">${fmtDate(parseDate(t.data_fim))}</td>
        <td class="col-prog progress-mini">${prog}%</td>
        <td class="col-acoes">
          <div class="actions">
            <button class="icon-btn" title="Adicionar subtarefa" data-addsub="${t.id}">＋</button>
            <button class="icon-btn" title="Editar" data-edit="${t.id}">✎</button>
            <button class="icon-btn ${t.pausada?'pause active':''}" title="${t.pausada?'Retomar':'Pausar'}" data-pause="${t.id}">${t.pausada?'▶':'⏸'}</button>
            <button class="icon-btn del" title="Excluir" data-del="${t.id}">🗑</button>
          </div>
        </td>
      </tr>
    `;
  }).join('');

  // Listeners
  tb.querySelectorAll('[data-toggle]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const id = el.getAttribute('data-toggle');
      collapsed[id] = !collapsed[id];
      render();
    };
  });
  tb.querySelectorAll('[data-addsub]').forEach(el => {
    el.onclick = () => openModal(null, el.getAttribute('data-addsub'));
  });
  tb.querySelectorAll('[data-edit]').forEach(el => {
    el.onclick = () => {
      const t = tarefas.find(x => x.id == el.getAttribute('data-edit'));
      openModal(t, null);
    };
  });
  tb.querySelectorAll('[data-pause]').forEach(el => {
    el.onclick = () => togglePause(el.getAttribute('data-pause'));
  });
  tb.querySelectorAll('[data-del]').forEach(el => {
    el.onclick = () => excluir(el.getAttribute('data-del'));
  });
}

/* ============================================================
   RENDER GRÁFICO
   ============================================================ */
function renderChart(flat) {
  const header = document.getElementById('chartHeader');
  const body = document.getElementById('chartBody');

  // Cabeçalho de meses
  const meses = [];
  let cur = new Date(minDate);
  while (cur <= maxDate) {
    const diasNoMes = new Date(cur.getFullYear(), cur.getMonth()+1, 0).getDate();
    meses.push({ label: fmtMonth(cur), width: diasNoMes * pxPerDay(), start: new Date(cur) });
    cur = new Date(cur.getFullYear(), cur.getMonth()+1, 1);
  }
  const totalWidth = meses.reduce((s,m)=>s+m.width, 0);
  header.innerHTML = meses.map(m =>
    `<div class="month-cell" style="width:${m.width}px">${m.label}</div>`
  ).join('');

  // Body
  if (flat.length === 0) {
    body.innerHTML = `<div style="height:80px;display:flex;align-items:center;justify-content:center;color:#555;font-size:13px;">Sem dados para exibir</div>`;
    return;
  }

  let html = '';
  flat.forEach(t => {
    const isSub = !!t.parent_id;
    const ini = parseDate(t.data_inicio), fim = parseDate(t.data_fim);
    const x = dateToX(ini);
    const w = Math.max(2, dateToX(fim) - x + pxPerDay());
    const prog = t.pausada ? (t.progresso ?? 0) : calcProgress(t);

    // Células de grid (meses)
    const cells = meses.map(m => `<div class="grid-cell" style="width:${m.width}px"></div>`).join('');

    const barClass = 'bar' + (t.pausada ? ' paused' : '') + (isSub ? ' sub-bar' : '');
    const barLabel = isSub ? '' : `<span class="label">${prog}%</span>`;

    html += `
      <div class="chart-row" data-row-id="${t.id}">
        ${cells}
        <div class="${barClass}" style="left:${x}px;width:${w}px" title="${escapeHtml(t.nome)} — ${prog}%">
          ${t.pausada ? '' : `<div class="fill" style="width:${100-prog}%;right:0;left:auto;border-right:none;border-left:2px solid rgba(255,255,255,0.4)"></div>`}
          ${barLabel}
        </div>
      </div>
    `;
  });

  // Linha "hoje"
  const hoje = today();
  if (hoje >= minDate && hoje <= maxDate) {
    const xHoje = dateToX(hoje);
    html += `<div class="today-line" style="left:${xHoje}px"></div>`;
  }

  body.innerHTML = html;

  // Ajustar largura do wrapper para permitir scroll
  document.getElementById('chartWrapper').style.width = totalWidth + 'px';
}

/* ============================================================
   SCROLL SINCRONIZADO (vertical)
   ============================================================ */
function syncScroll() {
  const fixed = document.getElementById('fixedScroll');
  const scroll = document.getElementById('scrollPanel');
  let syncing = false;

  fixed.addEventListener('scroll', () => {
    if (syncing) return;
    syncing = true;
    scroll.scrollTop = fixed.scrollTop;
    syncing = false;
  });
  scroll.addEventListener('scroll', () => {
    if (syncing) return;
    syncing = true;
    fixed.scrollTop = scroll.scrollTop;
    syncing = false;
  });
}

/* ============================================================
   MODAL
   ============================================================ */
const overlay = document.getElementById('modalOverlay');
const form = document.getElementById('taskForm');

function openModal(task, parentId) {
  form.reset();
  document.getElementById('taskId').value = task ? task.id : '';
  document.getElementById('taskParent').value = parentId || (task ? task.parent_id || '' : '');
  document.getElementById('modalTitle').textContent = task ? 'Editar Tarefa' : (parentId ? 'Nova Subtarefa' : 'Nova Tarefa');

  if (task) {
    document.getElementById('inputNome').value = task.nome || '';
    document.getElementById('inputResp').value = task.responsavel || '';
    document.getElementById('inputInicio').value = task.data_inicio || '';
    document.getElementById('inputFim').value = task.data_fim || '';
  } else {
    const hoje = today();
    document.getElementById('inputInicio').value = fmtInput(hoje);
    document.getElementById('inputFim').value = fmtInput(addDays(hoje, 7));
  }
  overlay.classList.add('open');
}
function closeModal() { overlay.classList.remove('open'); }

document.getElementById('btnCancel').onclick = closeModal;
overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const id = document.getElementById('taskId').value;
  const parentId = document.getElementById('taskParent').value || null;
  const nome = document.getElementById('inputNome').value.trim();
  const resp = document.getElementById('inputResp').value.trim();
  const ini = document.getElementById('inputInicio').value;
  const fim = document.getElementById('inputFim').value;

  if (!nome || !ini || !fim) return alert('Preencha todos os campos obrigatórios.');
  if (parseDate(fim) < parseDate(ini)) return alert('Data de fim não pode ser anterior à de início.');

  const payload = {
    nome,
    responsavel: resp,
    data_inicio: ini,
    data_fim: fim,
    parent_id: parentId
  };

  try {
    let resp2;
    if (id) {
      resp2 = await db.from(TABLE).update(payload).eq('id', id);
    } else {
      payload.ordem = (tarefas.reduce((m,t)=>Math.max(m, t.ordem||0), 0)) + 1;
      payload.pausada = false;
      payload.progresso = 0;
      resp2 = await db.from(TABLE).insert([payload]);
    }
    if (resp2.error) throw resp2.error;
    closeModal();
    await carregar();
  } catch (e) {
    console.error(e);
    alert('Erro ao salvar: ' + e.message);
  }
});

/* ============================================================
   EXCLUIR
   ============================================================ */
async function excluir(id) {
  const t = tarefas.find(x => x.id == id);
  if (!t) return;
  const filhos = getChildren(id);
  let msg = `Excluir a tarefa "${t.nome}"?`;
  if (filhos.length > 0) msg += `\n\nAtenção: ${filhos.length} subtarefa(s) também serão excluídas.`;
  if (!confirm(msg)) return;

  try {
    // exclui filhos recursivamente (o banco pode ter ON DELETE CASCADE, mas garantimos)
    async function delRec(parentId) {
      const kids = tarefas.filter(x => x.parent_id == parentId);
      for (const k of kids) await delRec(k.id);
      const r = await db.from(TABLE).delete().eq('id', parentId);
      if (r.error) throw r.error;
    }
    await delRec(id);
    await carregar();
  } catch (e) {
    console.error(e);
    alert('Erro ao excluir: ' + e.message);
  }
}

/* ============================================================
   PAUSAR / RETOMAR
   ============================================================ */
async function togglePause(id) {
  const t = tarefas.find(x => x.id == id);
  if (!t) return;
  try {
    let payload;
    if (!t.pausada) {
      // pausar: congela progresso atual
      payload = { pausada: true, progresso: calcProgress(t) };
    } else {
      // retomar: mantém progresso atual como base? Não — recalculamos pelas datas.
      // Para retomar "de onde parou", guardaríamos um offset. Simplificação: volta ao cálculo por datas.
      payload = { pausada: false };
    }
    const r = await db.from(TABLE).update(payload).eq('id', id);
    if (r.error) throw r.error;
    await carregar();
  } catch (e) {
    console.error(e);
    alert('Erro ao pausar/retomar: ' + e.message);
  }
}

/* ============================================================
   BOTÕES GLOBAIS
   ============================================================ */
document.getElementById('btnAdd').onclick = () => openModal(null, null);
document.getElementById('btnRefresh').onclick = () => carregar();

/* ============================================================
   HELPERS
   ============================================================ */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
window.addEventListener('load', () => {
  carregar();
  // Recalcula progresso a cada 5 min (caso o app fique aberto)
  setInterval(() => {
    tarefas.forEach(t => { 
      if (!t.pausada) t.progresso = calcProgress(t); 
    });
    render();
  }, 300000);
});
</script>
